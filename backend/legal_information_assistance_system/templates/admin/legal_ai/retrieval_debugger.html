{% extends "admin/custom_base.html" %}
{% block content %}
<div class="legal-dashboard-shell">
  <h1 class="mb-3">Retrieval Debugger</h1>
  <form method="post" class="mb-4">
    {% csrf_token %}
    <textarea name="query" class="form-control mb-2" rows="3" placeholder="Type a legal query...">{{ query }}</textarea>
    <button class="btn btn-primary"><i class="fa-solid fa-magnifying-glass me-1"></i>Search</button>
  </form>
  {% if results %}
  <div class="stack gap-3">
    {% for hit in results %}
    <div class="card p-3">
      <div class="d-flex justify-content-between">
        <strong>{{ hit.document_name }}</strong>
        <span class="badge bg-info">Score {{ hit.score|floatformat:4 }}</span>
      </div>
      <div class="text-muted">{{ hit.text|truncatechars:500 }}</div>
    </div>
    {% endfor %}
  </div>
  {% endif %}
</div>
{% endblock %}
