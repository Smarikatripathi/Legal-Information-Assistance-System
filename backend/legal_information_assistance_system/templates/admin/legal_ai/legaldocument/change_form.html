{% extends "admin/change_form.html" %}
{% load static %}

{% block extrahead %}
{{ block.super }}
<style>
.form-actions {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
}

.action-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.375rem;
    padding: 0.375rem 0.75rem;
    border-radius: 0.375rem;
    font-size: 0.875rem;
    font-weight: 500;
    text-decoration: none;
    transition: all 0.2s ease;
}

.action-btn-preview {
    background-color: rgba(37, 99, 235, 0.1);
    color: #2563eb;
    border: 1px solid rgba(37, 99, 235, 0.2);
}

.action-btn-preview:hover {
    background-color: #2563eb;
    color: white;
}

.action-btn-download {
    background-color: rgba(22, 163, 74, 0.1);
    color: #16a34a;
    border: 1px solid rgba(22, 163, 74, 0.2);
}

.action-btn-download:hover {
    background-color: #16a34a;
    color: white;
}

.pipeline-status-card {
    background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
    border: 1px solid #e2e8f0;
    border-radius: 0.75rem;
    padding: 1.25rem;
    margin-bottom: 1.5rem;
}

.pipeline-status-header {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 1rem;
}

.pipeline-status-icon {
    width: 40px;
    height: 40px;
    border-radius: 0.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.25rem;
}

.pipeline-steps {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 0.75rem;
}

.pipeline-step {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.5rem 0.75rem;
    border-radius: 0.375rem;
    background-color: #f8fafc;
    font-size: 0.875rem;
}

.pipeline-step.completed {
    background-color: rgba(22, 163, 74, 0.1);
    color: #16a34a;
}

.pipeline-step.pending {
    background-color: rgba(245, 158, 11, 0.1);
    color: #f59e0b;
}

.pipeline-step i {
    font-size: 1rem;
}
</style>
{% endblock %}

{% block object-tools-items %}
{{ block.super }}
{% if original and original.file %}
<li>
    <div class="form-actions">
        <a href="{% url 'admin:legal_ai_legaldocument_preview' original.pk %}" class="action-btn action-btn-preview">
            <i class="fa-solid fa-file-pdf"></i> Preview PDF
        </a>
        <a href="{{ original.file.url }}" class="action-btn action-btn-download" download>
            <i class="fa-solid fa-download"></i> Download
        </a>
    </div>
</li>
{% endif %}
{% endblock %}
