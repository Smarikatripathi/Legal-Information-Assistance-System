{% extends "admin/base_site.html" %}
{% load static %}

{% block extrahead %}
{{ block.super }}
<link rel="stylesheet" href="{% static 'admin/css/custom_admin.css' %}">
<style>
  /* Force sidebar background to white */
  .main-sidebar, .sidebar, .wrapper .main-sidebar, .wrapper .sidebar,
  .sidebar-dark-primary, .sidebar-dark,
  .main-sidebar .nav-sidebar, .sidebar .nav-sidebar,
  .wrapper .main-sidebar .nav-sidebar, .wrapper .sidebar .nav-sidebar {
    background: #ffffff !important;
  }
  
  /* Force all sidebar text to black */
  .main-sidebar *, .sidebar *, .sidebar-dark-primary *, .sidebar-dark * {
    color: #334155 !important;
  }
  
  /* Nav link specific overrides */
  .main-sidebar .nav-sidebar .nav-link, .sidebar .nav-sidebar .nav-link,
  .sidebar-dark-primary .nav-sidebar > .nav-item > .nav-link,
  .sidebar-dark .nav-sidebar > .nav-item > .nav-link {
    color: #334155 !important;
    background: #ffffff !important;
  }
  
  /* Hover state */
  .main-sidebar .nav-sidebar .nav-link:hover, .sidebar .nav-sidebar .nav-link:hover,
  .sidebar-dark-primary .nav-sidebar > .nav-item > .nav-link:hover,
  .sidebar-dark .nav-sidebar > .nav-item > .nav-link:hover {
    background: #f1f5f9 !important;
    color: #2563eb !important;
  }
  
  /* Active state */
  .main-sidebar .nav-sidebar .nav-link.active, .sidebar .nav-sidebar .nav-link.active,
  .sidebar-dark-primary .nav-sidebar > .nav-item > .nav-link.active,
  .sidebar-dark .nav-sidebar > .nav-item > .nav-link.active {
    background: #f1f5f9 !important;
    color: #2563eb !important;
  }
  
  /* Icon colors */
  .main-sidebar .nav-sidebar .nav-link i, .sidebar .nav-sidebar .nav-link i,
  .sidebar-dark-primary .nav-sidebar > .nav-item > .nav-link i,
  .sidebar-dark .nav-sidebar > .nav-item > .nav-link i {
    color: #334155 !important;
  }
  
  /* Icon hover/active colors */
  .main-sidebar .nav-sidebar .nav-link:hover i, .sidebar .nav-sidebar .nav-link:hover i,
  .sidebar-dark-primary .nav-sidebar > .nav-item > .nav-link:hover i,
  .sidebar-dark .nav-sidebar > .nav-item > .nav-link:hover i,
  .main-sidebar .nav-sidebar .nav-link.active i, .sidebar .nav-sidebar .nav-link.active i,
  .sidebar-dark-primary .nav-sidebar > .nav-item > .nav-link.active i,
  .sidebar-dark .nav-sidebar > .nav-item > .nav-link.active i {
    color: #2563eb !important;
  }
  
  /* Brand text */
  .main-sidebar .sidebar-brand, .sidebar .sidebar-brand {
    background: #ffffff !important;
    color: #0f172a !important;
  }
  .main-sidebar .brand-text, .sidebar .brand-text {
    color: #0f172a !important;
  }
  
  /* User panel */
  .main-sidebar .user-panel, .sidebar .user-panel {
    background: #ffffff !important;
    color: #0f172a !important;
  }
  .main-sidebar .user-panel .info, .sidebar .user-panel .info {
    color: #0f172a !important;
  }
  
  /* Nav tree headers */
  .nav-header, .nav-sidebar .nav-header {
    color: #64748b !important;
  }
  
  /* All text elements in sidebar */
  .main-sidebar p, .sidebar p,
  .main-sidebar span, .sidebar span,
  .main-sidebar div, .sidebar div,
  .main-sidebar h1, .sidebar h1,
  .main-sidebar h2, .sidebar h2,
  .main-sidebar h3, .sidebar h3,
  .main-sidebar h4, .sidebar h4,
  .main-sidebar h5, .sidebar h5,
  .main-sidebar h6, .sidebar h6 {
    color: #334155 !important;
  }
</style>
{% endblock %}

{% block extrajs %}
{{ block.super }}
<script src="{% static 'admin/js/custom_admin.js' %}" defer></script>
{% endblock %}
