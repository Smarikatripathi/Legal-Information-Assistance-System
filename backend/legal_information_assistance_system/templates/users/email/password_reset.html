<!DOCTYPE html>
<html>
  <body style="font-family: Arial, sans-serif; line-height: 1.5; color: #222;">
    <p>Hello{% if user.first_name %} {{ user.first_name }}{% endif %},</p>
    <p>You requested a password reset for your {{ site_name }} account.</p>
    <p>
      <a href="{{ reset_link }}" style="display:inline-block;padding:10px 16px;background:#0d6efd;color:#fff;text-decoration:none;border-radius:4px;">
        Reset your password
      </a>
    </p>
    <p>Or copy this link into your browser:</p>
    <p style="word-break: break-all;">{{ reset_link }}</p>
    <p>If you did not request this, you can ignore this email.</p>
    <p>Thanks,<br />{{ site_name }} Team</p>
  </body>
</html>
